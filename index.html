<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>⭐ Бесплатные звёзды</title><link rel="stylesheet" href="style.css"></head><body><main class="app">
<section id="auth" class="card"><h1>⭐ Бесплатные звёзды</h1><p>Выполняй задания и получай звёзды.</p><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Пароль"><button id="login">Войти</button><button id="reg" class="dark">Регистрация</button><p id="authMsg"></p></section>
<section id="main" hidden><header><b>⭐ Stars</b><button id="logout" class="dark">Выйти</button></header><div class="balance">Баланс: <b id="bal">0</b> ⭐</div><nav><button data-page="tasks">📋 Задания</button><button data-page="withdraw">🎁 Вывод</button><button data-page="promo">🎟 Промокод</button><button id="adminBtn" data-page="admin" hidden>🛠 Админ</button></nav>
<section id="tasks" class="card page"><h2>Задания</h2><div id="taskList"></div></section>
<section id="withdraw" class="card page" hidden><button class="dark" data-page="tasks">← Главное меню</button><h2>🎁 Вывод</h2><p>Если звёзд недостаточно, вывести их нельзя.</p><h3>Выберите сумму:</h3><div class="grid"><button data-amount="15">15 ⭐</button><button data-amount="25">25 ⭐</button><button data-amount="50">50 ⭐</button></div><div id="flow"></div></section>
<section id="promo" class="card page" hidden><button class="dark" data-page="tasks">← Главное меню</button><h2>🎟 Промокод</h2><input id="promoCode" placeholder="Введите промокод"><button id="usePromo">Активировать</button><p id="promoMsg"></p></section>
<section id="admin" class="card page" hidden><h2>🛠 Админ-панель</h2><h3>Создать задание</h3><input id="tTitle" placeholder="Название"><input id="tDesc" placeholder="Описание"><input id="tReward" type="number" min="1" placeholder="Награда ⭐"><button id="addTask">Создать</button><h3>Заказы</h3><div id="orders"></div></section>
</section></main><script type="module" src="app.js"></script></body></html>
